<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Configo</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Poppins, "Segoe UI", Arial, sans-serif; }
  [hidden] { display: none !important; }

  /* =====================================================
     PAGE 1: LANDING (your design, every rule starts with #landing)
     ===================================================== */
  #landing { height: 100vh; display: flex; background: #6b97c2; overflow: hidden; }

  .deco { position: absolute; pointer-events: none; z-index: 0; }

  #landing .left { flex: 1; padding: 24px 6vw; color: #fff; display: flex; flex-direction: column; position: relative; }
  #landing .logo, #landing .text { position: relative; z-index: 1; }
  #landing .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: 4px; color: #2b5b8a; margin-left: -60px; margin-top: -10px; }
  #landing .text { margin-top: 120px; }
  #landing h1 { font-size: 3rem; line-height: 1.1; max-width: 600px; margin-top: -70px; }
  #landing p { font-size: 1.5rem; line-height: 1.5; max-width: 480px; margin: 0 0 40px; }
  #landing p b { color: #6a4fb6; }
  #landing .btn { background: #2b6ca3; color: #fff; border: 0; padding: 14px 34px; font: inherit; font-weight: 600; letter-spacing: 1px; cursor: pointer; }
  .toto { height: 30px; }

  #landing .right { position: relative; width: 29%; background: #fff; border-top-left-radius: 100% 100%; }
  #landing .right img { position: absolute; left: 0; top: 50%; width: 300px; max-width: none; transform: translate(-45%, -50%); }
  #landing .right .tr { top: 0; right: 0; left: auto; transform: none; max-width: none; width: 350px; height: 450px; margin-top: -70px; margin-right: -80px; }

  /* =====================================================
     PAGE 2: THE APP (every rule starts with #app)
     ===================================================== */
  #app { color: #2b6ca3; background: #fff; min-height: 100vh; }

  #app header {
    height: 85px; background: #6b97c2; padding: 0 28px;
    display: flex; align-items: center; justify-content: space-between;
    border-radius: 0 0 50% 50% / 0 0 26px 26px; position: relative; z-index: 20;
  }
  #app header img { height: 60px; }
  .burger { background: none; border: 0; width: 50px; padding: 0; cursor: pointer; }
  .burger i { display: block; height: 5px; background: #fff; margin: 7px 0; }

  .sidebar {
    display: none; position: fixed; top: 85px; right: 0; bottom: 0; width: 330px; z-index: 10;
    background: #f0f7ff; padding: 50px 45px; flex-direction: column; gap: 26px;
    box-shadow: -4px 0 12px rgba(0,0,0,.08);
  }
  .sidebar.open { display: flex; }
  .sidebar button { background: #f4f9ff; border: 1px solid #9db6d1; padding: 12px; font: inherit; color: #555; cursor: pointer; }
  .sidebar button.active { color: #2b6ca3; border-color: #2b6ca3; }
  .sidebar button:hover { border-color: #2b6ca3; }

  #app main { padding: 22px 48px 40px; }
  #app h2 { margin: 0 0 8px; font-weight: 600; font-size: 1.5rem; }
  #app .sub { margin: 0 0 22px; }
  .cols { display: grid; grid-template-columns: 5fr 6.5fr; gap: 32px; align-items: start; }

  #schema { border: 3px solid #a9cbee; border-radius: 8px; background: #fff; height: 360px; }

  #app table { border-collapse: separate; border-spacing: 8px; width: 100%; }
  #app th { background: #a9cbee; color: #fff; padding: 14px 8px; font-weight: 500; }
  #app td { background: #f1f7fd; padding: 0; }
  #app tr:nth-child(even) td { background: #deecfb; }
  #app td span { display: block; padding: 14px 8px; }
  #app td input { width: 100%; border: 0; background: transparent; padding: 14px 8px; font: inherit; color: inherit; }
  #app td input:focus { outline: 2px solid #2b6ca3; }

  .foot { text-align: right; margin-top: 16px; }
  #app .btn { background: #2b6ca3; color: #fff; border: 0; padding: 14px 34px; font: inherit; font-weight: 500; letter-spacing: 1px; cursor: pointer; }

  /* ===== NEW: IP Addresses section (only these rules are new) ===== */
  #app { position: relative; }
  .square { position: relative; }                       /* wraps #schema so the bottom image can sit on it */
  .img-top    { position: absolute; top: 62px; right: 18px; width: 190px; z-index: 5; pointer-events: none; margin-top: -50px; }   /* fog.png  */
  .img-bottom { position: absolute; left: -8px; bottom: -26px; width: 350px; pointer-events: none; margin-bottom: -200px;margin-left: -100px; }             /* taht.png */
  #app td input::placeholder { color: #8d8d8d; font-size: .85rem; }
  /* NEW: the message under the table */
  .msg { margin-top: 12px; font-size: .92rem; min-height: 1.2em; }
  .msg.ok { color: #1a7f37; } .msg.bad { color: #b42318; }
  .msg ul { margin: 6px 0 0 18px; padding: 0; }
</style>
</head>
<body>

<!-- ================= PAGE 1 ================= -->
<div id="landing">
  <div class="left">
    <div class="logo">
      <img src="img1-removebg-preview.png" alt="im1" width="200" height="150">
    </div>
    <div class="text">
      <h1>Automate Your Network Configuration</h1>
      <div class="toto"></div>
      <p>Upload your <b>GNS3</b> topology &ndash; <b>Configo</b> will detect nodes, links, and generate your network configurations instantly.</p>
      <div class="toto"></div>
      <button class="btn" onclick="document.getElementById('file').click()">IMPORT FILE</button>
      <input id="file" type="file" accept=".gns3,.json" hidden>
    </div>
  </div>

  <div class="right">
    <img class="deco tr" src="img5.png" alt="im5">
    <img src="img2.png" alt="im2">
  </div>
</div>

<!-- ================= PAGE 2 (hidden until a file is imported) ================= -->
<div id="app" hidden>
  <header>
    <img src="img1-removebg-preview.png" alt="im1">
    <button class="burger" onclick="document.getElementById('menu').classList.toggle('open')" aria-label="Menu"><i></i><i></i><i></i></button>
  </header>

  <!-- NEW: data-p + onclick on the first two buttons (they open the pages) -->
  <nav class="sidebar" id="menu">
    <button data-p="identity" onclick="showPage('identity')">Device Identity</button>
    <button data-p="ips" onclick="showPage('ips')">IP Addresses</button>
    <button data-p="routing" onclick="showPage('routing')">routing protocol</button>
    <button data-p="switching" onclick="showPage('switching')">switching protocol</button>
    <button>...</button>
    <button>...</button>
  </nav>

  <!-- NEW: top image, shown only on the IP page -->
  <img class="img-top onlyips" src="foo.png" alt="fog" hidden>

  <main>
    <h2 id="title">Define Device Identity</h2>
    <p class="sub" id="sub">Assign hostnames and access passwords for each device before configuration generation.</p>
    <div class="cols">
      <!-- NEW: .square wraps the schema; bottom image shown only on the IP page -->
      <div class="square">
        <div id="schema"></div>
        <img class="img-bottom onlyips" src="taht.png" alt="taht" hidden>
      </div>
      <div>
        <table>
          <thead id="thead"><tr><th>Device</th><th>Type</th><th>Hostname</th><th>Password</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
        <div id="msg" class="msg"></div>                                  <!-- NEW -->
        <div class="foot"><button class="btn" onclick="validate()">VALIDATE</button></div>
      </div>
    </div>
  </main>
</div>

<script src="topology.js"></script>
<script>
  let topology = null;
  const hostnames = {};
  let page = "identity";                              // NEW: which page is open
  const vals = {};                                   // NEW: remembers what you typed when you switch pages
  const get = (k, d = "") => vals[k] ?? d;           // NEW
  const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const kind = n => n.type === "vpcs" || /^pc/i.test(n.name) ? "pc" : /ovs|switch/i.test(n.name) ? "switch" : "router";

  /* ---------- PAGE 1 -> PAGE 2: what happens when a file is chosen ---------- */
  document.getElementById("file").addEventListener("change", e => importFile(e.target.files[0]));

  async function importFile(file) {
    if (!file) return;
    let data;
    try { data = JSON.parse(await file.text()); }
    catch { alert("This is not a valid .gns3 file."); return; }

    try {                                   // 1) normal way: ask the Python server
      const r = await fetch("/api/topology/import", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(data)});
      if (!r.ok) throw new Error((await r.json()).detail);
      topology = (await r.json()).topology;
    } catch (err) {                         // 2) server not running: read the file here (lets you test by double-clicking)
      console.warn("Server not available, reading the file in the browser:", err.message);
      try { topology = parseGns3(data); } catch { alert("Could not read the topology in this file."); return; }
    }
    showApp();
  }

  function parseGns3(data) {
    const t = data.topology || data, byId = {};
    (t.nodes || []).forEach(n => byId[n.node_id] = n);
    const port = (n, a, p, e) => {
      const hit = (n.ports || []).find(x => x.adapter_number === a && x.port_number === p);
      if (hit && hit.name) return hit.name;
      if (n.node_type === "docker") return "eth" + a;              // real .gns3 files often have no port names
      if (n.node_type === "vpcs") return "Ethernet" + a;
      if (n.node_type === "ethernet_switch") return "Ethernet" + p;
      return (e.label && e.label.text) || `${a}/${p}`;
    };
    return {
      nodes: (t.nodes || []).map(n => ({name: n.name, type: n.node_type})),
      links: (t.links || []).map(l => l.nodes.map(e => `${byId[e.node_id].name}:${port(byId[e.node_id], e.adapter_number, e.port_number, e)}`).join(" <-> "))
    };
  }

  /* ---------- PAGE 2 ---------- */
  function showApp() {
    document.getElementById("landing").hidden = true;
    document.getElementById("app").hidden = false;
    showPage("identity");                                // CHANGED: was the table code, now it lives in showPage below
    loadCurrent();                                       // NEW: fill the tables with what is really in GNS3
  }

  /* NEW: every cabled interface once, for the IP table */
  function interfaces() {
    const seen = new Set(), out = [];
    topology.links.forEach(l => l.split(" <-> ").forEach(e => {
      if (seen.has(e)) return;
      seen.add(e);
      const i = e.indexOf(":");
      out.push({device: e.slice(0, i), interface: e.slice(i + 1)});
    }));
    return out;
  }

  /* NEW: "192.168.1.29 255.255.255.0" -> "192.168.1.29/24" (only for the label on the drawing) */
  function short(v) {
    const m = v.trim().split(/[\s/]+/);
    if (m.length < 2 || /^\d+$/.test(m[1])) return m.join("/");
    const bits = m[1].split(".").map(Number).reduce((a, o) => a + o.toString(2).replace(/0/g, "").length, 0);
    return m[0] + "/" + bits;
  }

  /* NEW: the two pages. "identity" is your old table, unchanged; "ips" is the new one */
  const PAGES = {
    identity: {
      title: "Define Device Identity",
      sub: "Assign hostnames and access passwords for each device before configuration generation.",
      heads: ["Device", "Type", "Hostname", "Password"],
      rows: () => topology.nodes.map(n => {
        const k = kind(n);
        return `<tr data-device="${esc(n.name)}">
          <td><span>${esc(n.name)}</span></td>
          <td><span>${k}</span></td>
          <td><input class="host" data-k="host|${esc(n.name)}" value="${esc(get("host|" + n.name, n.name.replace(/[^A-Za-z0-9-]/g, "-")))}"></td>
          <td>${k === "pc" ? "<span>-</span>" : `<input type="password" data-k="pass|${esc(n.name)}" value="${esc(get("pass|" + n.name))}">`}</td>
        </tr>`;
      }).join("")
    },
    ips: {
      title: "Assign IP Addresses",
      sub: "Set IP addresses and subnet masks for each device interface.",
      heads: ["Device", "Interface", "IP Address &amp; Subnet Mask", "Gateway"],
      rows: () => interfaces().map(i => {
        const k = i.device + "|" + i.interface;
        return `<tr>
          <td><span>${esc(i.device)}</span></td>
          <td><span>${esc(i.interface)}</span></td>
          <td><input data-k="ip|${esc(k)}" value="${esc(get("ip|" + k))}"></td>
          <td><input data-k="gw|${esc(k)}" value="${esc(get("gw|" + k))}"></td>
        </tr>`;
      }).join("")
    }
  };

  /* NEW: switches the page (title, table, images) */
  function showPage(p) {
    const P = PAGES[p];
    page = p;                                           // NEW
    document.getElementById("title").textContent = P.title;
    document.getElementById("sub").textContent = P.sub;
    document.getElementById("thead").innerHTML = `<tr>${P.heads.map(h => `<th>${h}</th>`).join("")}</tr>`;
    document.getElementById("rows").innerHTML = P.rows();
    document.getElementById("menu").classList.remove("open");
    document.querySelectorAll("#menu button[data-p]").forEach(b => b.classList.toggle("active", b.dataset.p === p));
    document.querySelectorAll(".onlyips").forEach(e => e.hidden = p !== "ips");   // fog.png and taht.png only on the IP page
    draw();
  }

  /* the topology square: hostnames under the icons (and NEW: IPs at the cable ends) */
  function draw() {
    topology.nodes.forEach(n => hostnames[n.name] = get("host|" + n.name, n.name.replace(/[^A-Za-z0-9-]/g, "-")));
    const labels = {};                                                              // NEW
    interfaces().forEach(i => {
      const v = get("ip|" + i.device + "|" + i.interface).trim();
      if (v) labels[i.device + "|" + i.interface] = short(v);
    });
    const box = document.getElementById("schema");
    if (window.drawTopology) drawTopology(box, topology, {hostnames, labels});
    else box.textContent = "Put topology.js in the same folder as this file.";
  }
  document.getElementById("rows").addEventListener("input", e => {
    if (e.target.dataset.k) { vals[e.target.dataset.k] = e.target.value; draw(); }
  });

  /* ===== NEW: talk to the backend ===== */
  async function api(path, body) {
    const r = await fetch(path, body === undefined ? {} : {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.detail || r.statusText);
    return j;
  }
  function msg(html, cls = "") { const m = document.getElementById("msg"); m.className = "msg " + cls; m.innerHTML = html; }

  /* reads hostnames / IPs / gateways from the real devices; never overwrites something you already typed */
  async function loadCurrent() {
    msg("Reading the real values from the devices in GNS3, please wait...");
    try {
      const cur = await api("/api/current");
      Object.entries(cur.hostnames).forEach(([d, h]) => { if (vals["host|" + d] === undefined) vals["host|" + d] = h; });
      Object.entries(cur.ips).forEach(([k, v]) => {
        if (vals["ip|" + k] === undefined) vals["ip|" + k] = v.ip;
        if (vals["gw|" + k] === undefined) vals["gw|" + k] = v.gateway || "";
      });
      showPage(page);
      const bad = Object.entries(cur.errors || {}).map(([d, e]) => esc(d) + ": " + esc(e));
      msg(bad.length ? "Could not read: " + bad.join("; ") : "Current values loaded from GNS3.", bad.length ? "bad" : "ok");
    } catch (e) { msg("Could not read GNS3 (" + esc(e.message) + "). Is the backend running?", "bad"); }
  }

  /* VALIDATE: checks the values, then applies them to the devices in GNS3 */
  async function validate() {
    const def = n => n.name.replace(/[^A-Za-z0-9-]/g, "-");
    const rows = page === "identity"
      ? topology.nodes.map(n => ({device: n.name, hostname: get("host|" + n.name, def(n)), password: get("pass|" + n.name)}))
      : interfaces().map(i => ({device: i.device, interface: i.interface,
          ip: get("ip|" + i.device + "|" + i.interface).trim(), gateway: get("gw|" + i.device + "|" + i.interface).trim()}));
    msg("Applying to the devices in GNS3, please wait...");
    try {
      const r = await api(page === "identity" ? "/api/apply/identity" : "/api/apply/ips", rows);
      msg(r.ok ? "Done. Applied on: " + r.applied.map(esc).join(", ")
               : "Please fix:<ul>" + r.errors.map(e => "<li>" + esc(e) + "</li>").join("") + "</ul>", r.ok ? "ok" : "bad");
    } catch (e) { msg(esc(e.message), "bad"); }
  }
</script>
<script>
/*
 * routing.js - "routing prot" pages of Configo:
 *   1) the protocol cards (OSPF / RIP / STATIC)
 *   2) one table per protocol, with the topology square on the left
 *
 * Loaded AFTER the main script of configo.html. It wraps showPage() and validate():
 * the Identity and IP pages keep working exactly as before.
 */
(function () {
  const origShow = window.showPage, origValidate = window.validate;
  const TITLE = "Routing Protocol Configuration";

  const CARDS = [
    { id: "ospf",   title: "OSPF",   text: "Fast convergence, hierarchical routing." },
    { id: "rip",    title: "RIP",    text: "Simple, hop-based distance vector." },
    { id: "static", title: "STATIC", text: "Full control over route paths." }
  ];

  const PROTO = {
    ospf: {
      name: "OSPF", api: "/api/apply/ospf",
      sub: "Choose a process ID, assign areas, and select interfaces or networks to include.",
      heads: ["Router", "Process ID", "Area ID", "Networks to include"],
      fields: ["process_id", "area", "networks"],
      hint: { process_id: "1", area: "0", networks: "192.168.10.0/24, 10.0.0.0/30" },
      fresh: dev => ({ device: dev, process_id: "1", area: "0", networks: "", auto: true }),
      blank: r => !r.networks.trim()
    },
    rip: {
      name: "RIP", api: "/api/apply/rip",
      sub: "Choose the RIP version and the connected networks to advertise.",
      heads: ["Router", "Version", "Networks to include"],
      fields: ["version", "networks"],
      hint: { version: "2", networks: "192.168.10.0/24" },
      fresh: dev => ({ device: dev, version: "2", networks: "", auto: true }),
      blank: r => !r.networks.trim()
    },
    static: {
      name: "STATIC", api: "/api/apply/static",
      sub: "Add routes by hand: a destination network and the next hop that reaches it.",
      heads: ["Router", "Destination network", "Next hop"],
      fields: ["prefix", "next_hop"],
      hint: { prefix: "10.0.0.0/8", next_hop: "192.168.10.2" },
      fresh: dev => ({ device: dev, prefix: "", next_hop: "" }),
      blank: r => !r.prefix.trim() && !r.next_hop.trim()
    }
  };

  const rows = {};                                              // rows[protocol] = [{device, ...fields}]
  const routers = () => topology.nodes.filter(n => kind(n) === "router");

  /* "192.168.10.1/24" or "192.168.10.1 255.255.255.0" -> "192.168.10.0/24" */
  function netOf(v) {
    const [a, p] = short(v).split("/"), n = Number(p), o = (a || "").split(".").map(Number);
    if (o.length !== 4 || o.some(x => isNaN(x) || x < 0 || x > 255) || isNaN(n) || n < 0 || n > 32) return "";
    const mask = n === 0 ? 0 : (~0 << (32 - n)) >>> 0;
    const ip = ((o[0] << 24) | (o[1] << 16) | (o[2] << 8) | o[3]) >>> 0;
    const net = (ip & mask) >>> 0;
    return [net >>> 24, (net >>> 16) & 255, (net >>> 8) & 255, net & 255].join(".") + "/" + n;
  }

  /* the networks a router is directly connected to, from the IPs typed on the IP page */
  function connected(dev) {
    const out = [];
    interfaces().filter(i => i.device === dev).forEach(i => {
      const v = get("ip|" + dev + "|" + i.interface).trim();
      const n = v && netOf(v);
      if (n && !out.includes(n)) out.push(n);
    });
    return out;
  }

  /* ---------- extra elements, created once ---------- */
  const css = document.createElement("style");
  css.textContent = `
    #cards { position: relative; margin-top: 6px; }
    #cards .track { display: flex; gap: 48px; overflow-x: auto; padding: 0 70px 12px 56px; scroll-snap-type: x mandatory; scrollbar-width: none; }
    #cards .track::-webkit-scrollbar { display: none; }
    #cards .card { flex: 0 0 210px; height: 296px; background: #a9cbee; color: #fff; padding: 26px 18px 18px; display: flex; flex-direction: column; text-align: center; cursor: pointer; scroll-snap-align: start; border: 0; font: inherit; }
    #cards .card:nth-child(even) { background: #dbeafb; color: #2b6ca3; }
    #cards .card:hover { outline: 2px solid #2b6ca3; }
    #cards .card h3 { margin: 0 0 28px; font-size: 2.1rem; font-weight: 400; letter-spacing: 1px; }
    #cards .card p { margin: 0 auto; font-weight: 600; color: #0d2f5a; font-size: .95rem; line-height: 1.35; }
    #cards .card svg { margin-top: auto; width: 52px; height: 52px; }
    #cards .next { position: absolute; right: 0; top: 50%; transform: translateY(-50%); width: 56px; background: none; border: 0; cursor: pointer; color: #2b6ca3; padding: 0; }
    #app td select { width: 100%; border: 0; background: transparent; padding: 14px 8px; font: inherit; color: inherit; }
    #app td select:focus { outline: 2px solid #2b6ca3; }
    #app .btn.alt { background: #fff; color: #2b6ca3; border: 2px solid #2b6ca3; margin-right: 10px; }
    #title .back { cursor: pointer; }
    #title .crumb { color: #6a4fb6; }
  `;
  document.head.appendChild(css);

  const arrow = '<svg viewBox="0 0 52 52" fill="none" stroke="currentColor" stroke-width="2"><circle cx="26" cy="26" r="24"/><path d="M12 26h27M30 17l9 9-9 9"/></svg>';
  const chevron = '<svg viewBox="0 0 60 70" fill="none" stroke-width="5" stroke-linecap="round"><path d="M5 5l25 30-25 30" stroke="#6b97c2"/><path d="M28 5l25 30-25 30" stroke="#2b6ca3"/></svg>';

  const box = document.createElement("div");
  box.id = "cards";
  box.hidden = true;
  box.innerHTML =
    '<div class="track" id="track">' +
    CARDS.map(c => `<button class="card" onclick="showPage('${c.id}')"><h3>${c.title}</h3><p>${c.text}</p>${arrow}</button>`).join("") +
    '</div><button class="next" id="next" aria-label="More" onclick="document.getElementById(\'track\').scrollBy({left: 260, behavior: \'smooth\'})">' + chevron + '</button>';
  document.querySelector("#app .cols").before(box);

  const foot = document.querySelector("#app .foot");
  const addBtn = document.createElement("button");
  addBtn.className = "btn alt";
  addBtn.textContent = "+ ADD ROW";
  addBtn.hidden = true;
  addBtn.onclick = () => window.addRow();
  foot.prepend(addBtn);

  /* ---------- the table of one protocol ---------- */
  function table(p) {
    const P = PROTO[p], rs = routers();
    document.getElementById("thead").innerHTML = "<tr>" + P.heads.map(h => `<th>${h}</th>`).join("") + "</tr>";
    document.getElementById("rows").innerHTML = rows[p].map((r, i) => {
      const sel = `<select data-r="${i}" data-f="device">` +
        rs.map(n => `<option value="${esc(n.name)}"${n.name === r.device ? " selected" : ""}>${esc(n.name)}</option>`).join("") + "</select>";
      const cells = P.fields.map(f =>
        `<td><input data-r="${i}" data-f="${f}" value="${esc(r[f])}" placeholder="${esc(P.hint[f] || "")}"></td>`).join("");
      return `<tr><td>${sel}</td>${cells}</tr>`;
    }).join("");
  }

  document.getElementById("rows").addEventListener("input", e => {
    const t = e.target, P = PROTO[page];
    if (!P || t.dataset.r === undefined) return;
    const r = rows[page][+t.dataset.r];
    r[t.dataset.f] = t.value;
    if (t.dataset.f === "networks") r.auto = false;             // the user took control of this cell
  });
  document.getElementById("rows").addEventListener("change", e => {
    const t = e.target;
    if (t.tagName !== "SELECT" || !PROTO[page]) return;
    const r = rows[page][+t.dataset.r];
    r.device = t.value;
    if (r.auto) r.networks = connected(r.device).join(", ");
    table(page);
  });

  /* ---------- pages ---------- */
  window.showPage = function (p) {
    const cols = document.querySelector("#app .cols");
    if (p !== "routing" && !PROTO[p]) {                         // identity / ips: the old code
      box.hidden = true; cols.hidden = false; foot.hidden = false; addBtn.hidden = true;
      document.getElementById("title").textContent = "";
      return origShow(p);
    }
    page = p;
    const title = document.getElementById("title");
    document.getElementById("menu").classList.remove("open");
    document.querySelectorAll("#menu button[data-p]").forEach(b => b.classList.toggle("active", b.dataset.p === "routing"));
    document.querySelectorAll(".onlyips").forEach(e => e.hidden = true);

    if (p === "routing") {                                      // the cards
      title.textContent = TITLE;
      document.getElementById("sub").textContent = "Set up the routing logic for your network. Choose between dynamic protocols like OSPF and RIP, or go for a static routing approach.";
      box.hidden = false; cols.hidden = true; foot.hidden = true;
      const track = document.getElementById("track");
      document.getElementById("next").hidden = track.scrollWidth <= track.clientWidth;
      return;
    }

    const P = PROTO[p];                                         // a protocol table
    if (!rows[p]) rows[p] = routers().map(n => P.fresh(n.name));
    rows[p].forEach(r => { if (r.auto) r.networks = connected(r.device).join(", "); });
    title.innerHTML = `<span class="back" onclick="showPage('routing')">${TITLE}</span> <span class="crumb">&gt; ${P.name}</span>`;
    document.getElementById("sub").textContent = P.sub;
    box.hidden = true; cols.hidden = false; foot.hidden = false; addBtn.hidden = false;
    table(p);
    draw();
    msg(routers().length ? "" : "This topology has no router.", routers().length ? "" : "bad");
  };

  window.addRow = function () {
    const p = page, P = PROTO[p];
    if (!P || !routers().length) return;
    const last = rows[p][rows[p].length - 1];
    const r = P.fresh(last ? last.device : routers()[0].name);
    r.auto = false;                                             // an extra row is filled by hand
    rows[p].push(r);
    table(p);
  };

  window.validate = async function () {
    const P = PROTO[page];
    if (!P) return origValidate();
    const data = rows[page].filter(r => !P.blank(r)).map(r => {
      const o = {};
      Object.keys(r).filter(k => k !== "auto").forEach(k => o[k] = r[k].trim());
      return o;
    });
    if (!data.length) { msg("Nothing to apply: fill at least one row.", "bad"); return; }
    msg("Applying to the routers in GNS3, please wait (the first OSPF/RIP setup can take about a minute)...");
    try {
      const r = await api(P.api, data);
      msg(r.ok ? "Done. Applied on: " + r.applied.map(esc).join(", ")
               : "Please fix:<ul>" + r.errors.map(e => "<li>" + esc(e) + "</li>").join("") + "</ul>", r.ok ? "ok" : "bad");
    } catch (e) { msg(esc(e.message), "bad"); }
  };
})();

</script>
<script src="switching.js"></script>
</body>
</html>
